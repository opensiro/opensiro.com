name: Sync canonical VSM Index snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-vsm-index.yml"
      - "scripts/sync-vsm-index.cjs"
      - "scripts/sync-vsm-metrics.cjs"
      - "scripts/sync-vsm-oss-metrics.cjs"
      - "scripts/sync-index-preview.cjs"
      - "scripts/build-harness-monitor.cjs"
      - "scripts/templates/**"
      - "index-search-demo.js"
      - "index-vsm-flow.js"
      - "index-posters.css"
      - "harness-server.css"
      - "autonomy-key.css"
      - "harness-monitor.js"
      - "harness-monitor.css"
      - "vsm-index-metrics.css"
      - "tests/static-site.test.cjs"
      - "tests/index-preview-sync.test.cjs"
      - "tests/vsm-index-source-sync.test.cjs"
      - "tests/vsm-index-metrics-sync.test.cjs"
      - "tests/vsm-oss-metrics-sync.test.cjs"
  schedule:
    # Hourly at :17 UTC to keep the materialized site close to canonical Index main.
    - cron: "17 * * * *"
  repository_dispatch:
    types: ["vsm-index-main-updated"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "vsm-index-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout canonical VSM Harness Index
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-index
          ref: main
          path: .upstream/vsm-harness-index
          fetch-depth: 0

      - name: Checkout VSM OSS Organization metrics contract
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-oss-organization
          ref: main
          path: .upstream/vsm-oss-organization
          fetch-depth: 0

      - name: Checkout VSM Harness Profile
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-profile
          ref: main
          path: .upstream/vsm-harness-profile
          fetch-depth: 0

      - name: Checkout VSM Harness Skills
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-skills
          ref: main
          path: .upstream/vsm-harness-skills
          fetch-depth: 0

      - name: Checkout Awesome VSM Harness
        uses: actions/checkout@v4
        with:
          repository: opensiro/awesome-vsm-harness
          ref: main
          path: .upstream/awesome-vsm-harness
          fetch-depth: 0

      - name: Record canonical source revision and freshness
        shell: bash
        run: |
          echo "VSM_INDEX_SOURCE_REF=$(git -C .upstream/vsm-harness-index rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VSM_INDEX_SOURCE_UPDATED_AT=$(git -C .upstream/vsm-harness-index show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Record owning Organization renderer revision
        shell: bash
        run: |
          owner_ref="$(git -C .upstream/vsm-oss-organization rev-parse HEAD)"
          echo "VSM_ORGANIZATION_SOURCE_REF=$owner_ref" >> "$GITHUB_ENV"
          echo "Owner Organization renderer: $owner_ref"
          {
            echo "### Materialization source provenance"
            echo "- Index: \`$VSM_INDEX_SOURCE_REF\`"
            echo "- Organization renderer: \`$owner_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ignore duplicate Index events already materialized
        id: preflight
        shell: bash
        env:
          TRIGGER: ${{ github.event_name }}
          NOTIFIED_SHA: ${{ github.event.client_payload.index_sha }}
          NOTIFIED_REPO: ${{ github.event.client_payload.source_repository }}
        run: |
          set -euo pipefail
          published="$(node scripts/snapshot-provenance.cjs --print-source-sha)"
          node scripts/index-sync-gate.cjs preflight \
            --trigger "$TRIGGER" \
            --notified-sha "$NOTIFIED_SHA" \
            --notified-repo "$NOTIFIED_REPO" \
            --source-sha "$VSM_INDEX_SOURCE_REF" \
            --published-sha "$published" >> "$GITHUB_OUTPUT"

      - name: Validate canonical Index contract
        if: steps.preflight.outputs.skip != 'true'
        run: python .upstream/vsm-harness-index/scripts/check_index.py

      - name: Set up Python for canonical VSM OSS collector
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSM OSS collector dependency
        if: steps.preflight.outputs.skip != 'true'
        run: python -m pip install -r .upstream/vsm-oss-organization/requirements-metrics.txt

      - name: Sync VSM Index from canonical source
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/sync-vsm-index.cjs --source .upstream/vsm-harness-index

      - name: Sync VSM Index corpus metrics
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/sync-vsm-metrics.cjs --source .upstream/vsm-harness-index

      - name: Collect canonical public VSM OSS snapshot
        if: steps.preflight.outputs.skip != 'true'
        run: >-
          python .upstream/vsm-oss-organization/scripts/collect_public_metrics.py
          --profile-root .upstream/vsm-harness-profile
          --skills-root .upstream/vsm-harness-skills
          --index-root .upstream/vsm-harness-index
          --awesome-root .upstream/awesome-vsm-harness
          --organization-root .upstream/vsm-oss-organization
          --output .upstream/vsm-oss-metrics.json

      - name: Finalize VSM OSS historical windows
        if: steps.preflight.outputs.skip != 'true'
        run: >-
          python .upstream/vsm-oss-organization/scripts/finalize_public_metrics_windows.py
          --snapshot .upstream/vsm-oss-metrics.json
          --skills-root .upstream/vsm-harness-skills
          --index-root .upstream/vsm-harness-index
          --awesome-root .upstream/awesome-vsm-harness

      - name: Render VSM OSS activity block
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/sync-vsm-oss-metrics.cjs --source .upstream/vsm-oss-metrics.json

      - name: Sync home Index preview
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/sync-index-preview.cjs

      - name: Build paginated harness monitor
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/build-harness-monitor.cjs

      - name: Materialize Index source SHA provenance
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/snapshot-provenance.cjs --source-sha "$VSM_INDEX_SOURCE_REF"

      - name: Regress Henterprise against the canonical Index checkout
        if: steps.preflight.outputs.skip != 'true'
        env:
          CANONICAL_INDEX_ROOT: .upstream/vsm-harness-index
        run: node --test tests/source-snapshot-sync.test.cjs

      - name: Reject outdated source and reschedule reconciliation
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest="$(git ls-remote https://github.com/opensiro/vsm-harness-index.git refs/heads/main | cut -f1)"
          if ! node scripts/index-sync-gate.cjs before-publish --source-sha "$VSM_INDEX_SOURCE_REF" --latest-sha "$newest"; then
            echo "::warning::Index advanced to $newest while snapshot for $VSM_INDEX_SOURCE_REF was being built"
            gh workflow run sync-vsm-index.yml --ref main
            exit 1
          fi
          node scripts/snapshot-provenance.cjs --check

      - name: Remove upstream checkout
        if: steps.preflight.outputs.skip != 'true'
        run: rm -rf .upstream

      - name: Check static pages and generated snapshot consistency
        if: steps.preflight.outputs.skip != 'true'
        run: >-
          node --test
          tests/static-site.test.cjs
          tests/index-preview-sync.test.cjs
          tests/harness-monitor.test.cjs
          tests/vsm-index-source-sync.test.cjs
          tests/vsm-index-metrics-sync.test.cjs
          tests/vsm-oss-metrics-sync.test.cjs
          tests/source-snapshot-sync.test.cjs
          tests/served-snapshot-attestation.test.cjs

      - name: Verify sync changed only materialized pages
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          changed="$(git diff --name-only; git ls-files --others --exclude-standard)"
          if [ -z "$changed" ]; then
            echo "Canonical source produced no site changes."
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(index\.html|vsm-index\.html|harness-server\.html|harness-monitor\.html|scripts/templates/vsm-index-source\.html|assets/harness-index/(manifest|(rows|all)-[a-f0-9]+)\.js|assets/harness-index/source-manifest\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit changed snapshot
        if: steps.preflight.outputs.skip != 'true'
        id: commit
        shell: bash
        run: |
          git add index.html vsm-index.html harness-server.html harness-monitor.html scripts/templates/vsm-index-source.html assets/harness-index
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync VSM public snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy changed snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
