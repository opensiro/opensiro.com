name: Sync canonical VSM Index snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-vsm-index.yml"
      - "scripts/sync-vsm-index.cjs"
      - "scripts/sync-vsm-metrics.cjs"
      - "scripts/sync-vsm-oss-metrics.cjs"
      - "scripts/sync-index-preview.cjs"
      - "vsm-index-metrics.css"
      - "tests/static-site.test.cjs"
      - "tests/index-preview-sync.test.cjs"
      - "tests/vsm-index-source-sync.test.cjs"
      - "tests/vsm-index-metrics-sync.test.cjs"
      - "tests/vsm-oss-metrics-sync.test.cjs"
  schedule:
    # Once per day at 03:17 UTC. The offset avoids the busiest top-of-hour slot.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "vsm-index-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout canonical VSM Harness Index
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-index
          ref: main
          path: .upstream/vsm-harness-index
          fetch-depth: 0

      - name: Checkout VSM OSS Organization metrics contract
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-oss-organization
          ref: main
          path: .upstream/vsm-oss-organization
          fetch-depth: 0

      - name: Checkout VSM Harness Profile
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-profile
          ref: main
          path: .upstream/vsm-harness-profile
          fetch-depth: 0

      - name: Checkout VSM Harness Skills
        uses: actions/checkout@v4
        with:
          repository: opensiro/vsm-harness-skills
          ref: main
          path: .upstream/vsm-harness-skills
          fetch-depth: 0

      - name: Checkout Awesome VSM Harness
        uses: actions/checkout@v4
        with:
          repository: opensiro/awesome-vsm-harness
          ref: main
          path: .upstream/awesome-vsm-harness
          fetch-depth: 0

      - name: Record canonical source revision and freshness
        shell: bash
        run: |
          echo "VSM_INDEX_SOURCE_REF=$(git -C .upstream/vsm-harness-index rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VSM_INDEX_SOURCE_UPDATED_AT=$(git -C .upstream/vsm-harness-index show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python for canonical VSM OSS collector
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VSM OSS collector dependency
        run: python -m pip install -r .upstream/vsm-oss-organization/requirements-metrics.txt

      - name: Sync VSM Index from canonical source
        run: node scripts/sync-vsm-index.cjs --source .upstream/vsm-harness-index

      - name: Sync VSM Index corpus metrics
        run: node scripts/sync-vsm-metrics.cjs --source .upstream/vsm-harness-index

      - name: Collect canonical public VSM OSS snapshot
        run: >-
          python .upstream/vsm-oss-organization/scripts/collect_public_metrics.py
          --profile-root .upstream/vsm-harness-profile
          --skills-root .upstream/vsm-harness-skills
          --index-root .upstream/vsm-harness-index
          --awesome-root .upstream/awesome-vsm-harness
          --organization-root .upstream/vsm-oss-organization
          --output .upstream/vsm-oss-metrics.json

      - name: Finalize VSM OSS historical windows
        run: >-
          python .upstream/vsm-oss-organization/scripts/finalize_public_metrics_windows.py
          --snapshot .upstream/vsm-oss-metrics.json
          --skills-root .upstream/vsm-harness-skills
          --index-root .upstream/vsm-harness-index
          --awesome-root .upstream/awesome-vsm-harness

      - name: Render VSM OSS activity block
        run: node scripts/sync-vsm-oss-metrics.cjs --source .upstream/vsm-oss-metrics.json

      - name: Sync home Index preview
        run: node scripts/sync-index-preview.cjs

      - name: Remove upstream checkout
        run: rm -rf .upstream

      - name: Check static pages and generated snapshot consistency
        run: >-
          node --test
          tests/static-site.test.cjs
          tests/index-preview-sync.test.cjs
          tests/vsm-index-source-sync.test.cjs
          tests/vsm-index-metrics-sync.test.cjs
          tests/vsm-oss-metrics-sync.test.cjs

      - name: Verify sync changed only materialized pages
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Canonical source produced no site changes."
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(index\.html|vsm-index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit changed snapshot
        id: commit
        shell: bash
        run: |
          git add index.html vsm-index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync VSM public snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy changed snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
