# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Human and integration pushes to the default branch deploy immediately.
  push:
    branches: ["main"]

  # Refresh the profile-wide maintainer card without writing generated stats
  # back into either repository.
  schedule:
    - cron: "*/5 * * * *"

  # The canonical-source sync explicitly dispatches this workflow after
  # committing a changed materialized snapshot. This is necessary because a
  # push made with GITHUB_TOKEN does not itself trigger another workflow.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploy the materialized snapshot committed in opensiro.com plus a live
  # profile-wide maintainer card generated from GitHub contribution data.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          # Deploy latest main even for queued push/schedule events.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate live maintainer card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 https://github.com/xLagerFeuer/xLagerFeuer.git .profile-stats-source
          (
            cd .profile-stats-source
            python scripts/update_maintainer_stats.py
          )
          cp .profile-stats-source/assets/maintainer-activity.svg assets/profile-maintainer-activity.svg
          rm -rf .profile-stats-source

      - name: Check static pages and generated snapshot consistency
        run: >-
          node --test
          tests/static-site.test.cjs
          tests/harness-source-labels.test.cjs
          tests/index-preview-sync.test.cjs
          tests/harness-monitor.test.cjs
          tests/vsm-index-source-sync.test.cjs
          tests/vsm-index-metrics-sync.test.cjs
          tests/vsm-oss-metrics-sync.test.cjs
          tests/source-snapshot-sync.test.cjs
          tests/served-snapshot-attestation.test.cjs

      - name: Validate canonical Index snapshot provenance
        run: node scripts/snapshot-provenance.cjs --check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage active site
        run: |
          mkdir -p "$RUNNER_TEMP/opensiro-pages"
          rsync -a --exclude='/scripts/templates/' --exclude='/.git/' ./ "$RUNNER_TEMP/opensiro-pages/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Keep reruns of the same workflow run unambiguous for deploy-pages.
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opensiro-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Only content-changing/manual deploys need a live served-SHA gate.
      # Scheduled maintainer-card refreshes do not advance the Index source.
      - name: Attest served Index snapshot after Pages deployment
        if: github.event_name != 'schedule'
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-served-index-manifest.cjs
