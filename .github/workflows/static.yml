# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Human and integration pushes to the default branch deploy immediately.
  push:
    branches: ["main"]

  # The canonical-source sync explicitly dispatches this workflow after
  # committing a changed materialized snapshot. This is necessary because a
  # push made with GITHUB_TOKEN does not itself trigger another workflow.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploy the materialized snapshot committed in opensiro.com.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Check static pages and generated snapshot consistency
        run: >-
          node --test
          tests/static-site.test.cjs
          tests/harness-source-labels.test.cjs
          tests/index-preview-sync.test.cjs
          tests/vsm-index-source-sync.test.cjs
          tests/vsm-index-metrics-sync.test.cjs
          tests/vsm-oss-metrics-sync.test.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Keep reruns of the same workflow run unambiguous for deploy-pages.
          name: github-pages-${{ github.run_attempt }}
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
