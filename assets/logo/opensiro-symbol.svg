  <rect x="23" y="38" width="3" height="3" fill="#4488FF"/>
  <rect x="38" y="38" width="3" height="3" fill="#4488FF"/>

  <!-- Вторичные пиксели (синие) -->
  <!-- Верх -->
  <rect x="26" y="21" width="2" height="2" fill="#3366FF"/>
  <rect x="36" y="21" width="2" height="2" fill="#3366FF"/>

  <!-- Низ -->
  <rect x="26" y="41" width="2" height="2" fill="#3366FF"/>
  <rect x="36" y="41" width="2" height="2" fill="#3366FF"/>

  <!-- Лево -->
  <rect x="21" y="27" width="2" height="2" fill="#3366FF"/>
  <rect x="21" y="33" width="2" height="2" fill="#3366FF"/>

  <!-- Право -->
  <rect x="41" y="27" width="2" height="2" fill="#3366FF"/>
  <rect x="41" y="33" width="2" height="2" fill="#3366FF"/>

  <rect x="34" y="29" width="0.5" height="1" fill="#000000"/>
  <rect x="32" y="29" width="0.5" height="1" fill="#000000"/>

